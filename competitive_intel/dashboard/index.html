<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitive Intelligence — Telkomsel KTI</title>
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:          #F0F2F7;
  --surface:     #FFFFFF;
  --surface2:    #E8EBF3;
  --border:      #D1D5E0;
  --text:        #111827;
  --text-muted:  #5A6272;
  --text-faint:  #9AA1B0;

  --tsel:        #E10026;
  --tsel-light:  #FFF0F2;
  --tsel-mid:    #FFDDE2;
  --comp:        #2563EB;
  --comp-light:  #EEF4FF;
  --comp-mid:    #DBEAFE;

  --pos:         #16A34A;
  --pos-light:   #DCFCE7;
  --neg:         #DC2626;
  --neg-light:   #FEE2E2;
  --neu:         #D97706;
  --neu-light:   #FEF3C7;

  --radius:      8px;
  --radius-sm:   5px;
  --shadow:      0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:   0 4px 12px rgba(0,0,0,.10);

  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0D1117;
    --surface:    #161B27;
    --surface2:   #1E2535;
    --border:     #2A3045;
    --text:       #E8EAF0;
    --text-muted: #8B93A8;
    --text-faint: #4A5270;
    --tsel-light: #2A0A10;
    --tsel-mid:   #3D0F18;
    --comp-light: #0D1E3D;
    --comp-mid:   #132B55;
    --pos-light:  #052E16;
    --neg-light:  #2D0A0A;
    --neu-light:  #2D1A00;
  }
}

:root[data-theme="dark"] {
  --bg:         #0D1117;
  --surface:    #161B27;
  --surface2:   #1E2535;
  --border:     #2A3045;
  --text:       #E8EAF0;
  --text-muted: #8B93A8;
  --text-faint: #4A5270;
  --tsel-light: #2A0A10;
  --tsel-mid:   #3D0F18;
  --comp-light: #0D1E3D;
  --comp-mid:   #132B55;
  --pos-light:  #052E16;
  --neg-light:  #2D0A0A;
  --neu-light:  #2D1A00;
}

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
a { color: var(--comp); text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
svg { display: block; }

/* ── Top Bar ────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
}
.topbar-row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  gap: 16px;
  flex-wrap: wrap;
}
.brand-lockup {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--tsel);
  flex-shrink: 0;
}
.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.015em;
}
.brand-sub {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-muted);
  font-weight: 500;
}
.topbar-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}
.last-updated {
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: .03em;
}
.theme-toggle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: background .15s;
}
.theme-toggle:hover { background: var(--border); }

.topbar-row2 {
  display: flex;
  align-items: center;
  gap: 0;
  padding-bottom: 0;
  flex-wrap: wrap;
}
.filter-section {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  border-right: 1px solid var(--border);
  padding-right: 16px;
  margin-right: 16px;
}
.filter-section:last-child {
  border-right: none;
  padding-right: 0;
  margin-right: 0;
}
.filter-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-faint);
  font-weight: 600;
  white-space: nowrap;
}

/* Toggle buttons */
.toggle-group { display: flex; gap: 4px; }
.toggle-btn {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid var(--border);
  transition: all .15s;
  white-space: nowrap;
}
.toggle-btn:hover { background: var(--surface2); color: var(--text); }
.toggle-btn.active-mobile {
  background: var(--comp);
  border-color: var(--comp);
  color: #fff;
}
.toggle-btn.active-fixed {
  background: var(--tsel);
  border-color: var(--tsel);
  color: #fff;
}

/* Region chips */
.region-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  transition: all .15s;
  cursor: pointer;
}
.chip:hover { color: var(--text); border-color: var(--text-muted); }
.chip.active {
  background: var(--comp-mid);
  border-color: var(--comp);
  color: var(--comp);
}

/* Category tabs */
.cat-tabs { display: flex; gap: 0; }
.cat-tab {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  letter-spacing: .01em;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--comp); border-bottom-color: var(--comp); }

/* ── Page layout ────────────────────────────────────────── */
.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 24px 64px;
}

/* ── Summary strip ──────────────────────────────────────── */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.stat-card .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-faint);
  font-weight: 600;
  margin-bottom: 4px;
}
.stat-card .value {
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.stat-card .sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}
.stat-card.tsel .value { color: var(--tsel); }
.stat-card.comp .value { color: var(--comp); }

/* ── Source legend ──────────────────────────────────────── */
.source-legend {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 0 16px;
  font-size: 11px;
  color: var(--text-muted);
}
.source-legend span { display: flex; align-items: center; gap: 3px; }

/* ── Source filter chips ────────────────────────────────── */
.source-filter {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.source-chip {
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s;
}
.source-chip:hover { color: var(--text); border-color: var(--text-muted); }
.source-chip.active {
  background: var(--comp-mid);
  border-color: var(--comp);
  color: var(--comp);
}

/* ── Section heading ────────────────────────────────────── */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  margin-top: 28px;
}
.section-head:first-of-type { margin-top: 0; }
.section-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--text);
}
.section-desc {
  font-size: 11px;
  color: var(--text-muted);
}
.section-badge {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.badge-comp { background: var(--comp-light); color: var(--comp); }
.badge-tsel { background: var(--tsel-light); color: var(--tsel); }

/* ── Comparison table ───────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  background: var(--surface);
  margin-bottom: 24px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
thead th {
  padding: 10px 14px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 700;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface2);
}
thead th.tsel-col { background: var(--tsel-light); color: var(--tsel); }
thead th.comp-col { background: var(--comp-light); color: var(--comp); }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
td {
  padding: 9px 14px;
  vertical-align: middle;
  color: var(--text);
}
td.muted { color: var(--text-muted); font-size: 11.5px; }
td.price { font-weight: 600; }
.brand-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.brand-chip.tsel { background: var(--tsel-mid); color: var(--tsel); }
.brand-chip.comp { background: var(--comp-mid); color: var(--comp); }
.region-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  margin: 1px;
}
.region-tag.hit { background: #FEF9C3; border-color: #FDE047; color: #78350F; }

/* ── Source badge ───────────────────────────────────────── */
.src-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  white-space: nowrap;
}
.src-badge.instagram { background: #FDF2F8; border-color: #FBCFE8; color: #9D174D; }
.src-badge.google_play { background: #F0FDF4; border-color: #BBF7D0; color: #166534; }
.src-badge.app_store { background: #EFF6FF; border-color: #BFDBFE; color: #1E40AF; }
.src-badge.website { background: var(--surface2); border-color: var(--border); color: var(--text-muted); }
:root[data-theme="dark"] .src-badge.instagram,
:root:not([data-theme="light"]) .src-badge.instagram {
  background: #3B0A2A; border-color: #9D174D; color: #FBCFE8;
}
:root[data-theme="dark"] .src-badge.google_play,
:root:not([data-theme="light"]) .src-badge.google_play {
  background: #052E16; border-color: #166534; color: #BBF7D0;
}
:root[data-theme="dark"] .src-badge.app_store,
:root:not([data-theme="light"]) .src-badge.app_store {
  background: #0D1E3D; border-color: #1E40AF; color: #BFDBFE;
}

/* ── Stars ──────────────────────────────────────────────── */
.stars { color: #F59E0B; font-size: 10px; letter-spacing: 1px; }

/* ── Price chart ────────────────────────────────────────── */
.chart-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  overflow-x: auto;
}
.chart-panel h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.bar-chart { width: 100%; }
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.bar-label {
  width: 80px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 22px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
  display: flex;
  align-items: center;
  padding-left: 8px;
}
.bar-fill.tsel { background: var(--tsel); }
.bar-fill.comp { background: var(--comp); }
.bar-value {
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.bar-value-outside {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ── Sentiment panel ────────────────────────────────────── */
.sentiment-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.sentiment-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.sentiment-card .sc-brand {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sc-role {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
}
.sc-role.tsel { background: var(--tsel-light); color: var(--tsel); }
.sc-role.comp { background: var(--comp-light); color: var(--comp); }
.sentiment-bars { display: flex; flex-direction: column; gap: 5px; }
.sbar-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sbar-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sbar-dot.pos { background: var(--pos); }
.sbar-dot.neg { background: var(--neg); }
.sbar-dot.neu { background: var(--neu); }
.sbar-name {
  width: 52px;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  flex-shrink: 0;
}
.sbar-track {
  flex: 1;
  height: 8px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}
.sbar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .5s ease;
}
.sbar-fill.pos { background: var(--pos); }
.sbar-fill.neg { background: var(--neg); }
.sbar-fill.neu { background: var(--neu); }
.sbar-count {
  width: 20px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  text-align: right;
  flex-shrink: 0;
}

/* ── Promo cards ────────────────────────────────────────── */
.promo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.promo-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: box-shadow .15s, transform .15s;
}
.promo-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.promo-card .pc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.promo-card .pc-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
  margin-right: 8px;
}
.promo-card .pc-price {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pc-price.tsel { color: var(--tsel); }
.pc-price.comp { color: var(--comp); }
.promo-card .pc-snippet {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.promo-card .pc-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 4px;
}
.pc-regions { display: flex; flex-wrap: wrap; gap: 3px; }
.pc-likes {
  font-size: 10px;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  gap: 3px;
}

/* ── Program / Service cards ─────────────────────────────── */
.info-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.info-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-shadow: var(--shadow);
}
.info-item .ii-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.ii-icon.tsel { background: var(--tsel-light); }
.ii-icon.comp { background: var(--comp-light); }
.info-item .ii-body { flex: 1; min-width: 0; }
.ii-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ii-snippet {
  font-size: 11.5px;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ii-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}

/* ── Empty state ─────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-faint);
  font-size: 13px;
}

/* ── Visibility helper ──────────────────────────────────── */
.hidden { display: none !important; }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar-row2 { flex-direction: column; align-items: flex-start; }
  .filter-section { border-right: none; padding-right: 0; margin-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; width: 100%; }
  .filter-section:last-child { border-bottom: none; }
  .summary-strip { grid-template-columns: 1fr 1fr; }
  .bar-label { width: 60px; font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .bar-fill, .sbar-fill { transition: none; }
}
</style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────── -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row1">
      <div class="brand-lockup">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-name">Competitive Intel</div>
          <div class="brand-sub">Telkomsel · KTI Region</div>
        </div>
      </div>
      <div class="topbar-meta">
        <span class="last-updated" id="lastUpdated">Last updated: —</span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☀</button>
      </div>
    </div>

    <div class="topbar-row2">
      <!-- Brand type -->
      <div class="filter-section">

/* ─── State ─────────────────────────────────────────────── */
let state = {
  brandType: 'mobile',
  region: 'all',
  category: 'product',
  sourceFilter: 'all',  // 'all' | 'website' | 'instagram' | 'google_play' | 'app_store'
  data: null,
};

const REGION_GROUPS = {
  kalimantan: ["kalimantan","balikpapan","samarinda","banjarmasin","pontianak","palangkaraya"],
  sulawesi:   ["sulawesi","makassar","manado","palu","kendari","gorontalo"],
  maluku:     ["maluku","ambon","ternate","sorong"],
  papua:      ["papua","jayapura","timika","merauke","manokwari"],
};

function matchesRegion(item) {
  if (state.region === 'all') return true;
  const groupWords = REGION_GROUPS[state.region] || [];
  return (item.regions || []).some(r => groupWords.includes(r));
}

function matchesSource(item) {
  if (state.sourceFilter === 'all') return true;
  const src = item.source || 'website';
  return src === state.sourceFilter;
}

function filterItems(items) {
  return items.filter(item =>
    item.category === state.category && matchesRegion(item) && matchesSource(item)
  );
}

function getAllItems() {
  if (!state.data) return { comp: [], tsel: [] };
  const bd = state.data[state.brandType] || {};
  return {
    comp: filterItems(bd.competitor || []),
    tsel: filterItems(bd.telkomsel  || []),
  };
}

/* ─── Formatters ────────────────────────────────────────── */
function fmtPrice(p) {
  if (!p && p !== 0) return '—';
  return 'Rp ' + p.toLocaleString('id-ID');
}
function regionTags(regions) {
  if (!regions || !regions.length) return '<span style="color:var(--text-faint);font-size:10px;">—</span>';
  const grp = state.region !== 'all' ? (REGION_GROUPS[state.region] || []) : [];
  return regions.slice(0,3).map(r => {
    const hit = grp.length && grp.includes(r);
    return `<span class="region-tag${hit?' hit':''}">${r}</span>`;
  }).join('');
}

function sourceBadge(item) {
  const src = item.source || 'website';
  if (src === 'instagram') {
    const handle = item.handle ? ` ${item.handle}` : '';
    return `<span class="src-badge instagram">📸 Instagram${handle}</span>`;
  }
  if (src === 'google_play') {
    const stars = item.rating ? renderStars(item.rating) : '';
    return `<span class="src-badge google_play">⭐ Play Store${stars ? ' ' + stars : ''}</span>`;
  }
  if (src === 'app_store') {
    const stars = item.rating ? renderStars(item.rating) : '';
    return `<span class="src-badge app_store">🍎 App Store${stars ? ' ' + stars : ''}</span>`;
  }
  return `<span class="src-badge website">🌐 Website</span>`;
}

function renderStars(rating) {
  const n = Math.round(rating);
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

/* ─── Source filter row ─────────────────────────────────── */
function renderSourceFilter() {
  const options = [
    { key: 'all', label: 'Semua' },
    { key: 'website', label: '🌐 Website' },
    { key: 'instagram', label: '📸 Instagram' },
    { key: 'google_play', label: '⭐ Play Store' },
    { key: 'app_store', label: '🍎 App Store' },
  ];
  return `<div class="source-filter">${options.map(o =>
    `<button class="source-chip${state.sourceFilter === o.key ? ' active' : ''}"
      onclick="setSourceFilter('${o.key}')">${o.label}</button>`
  ).join('')}</div>`;
}

/* ─── Render: Summary strip ─────────────────────────────── */
function renderSummary() {
  const bd = state.data ? (state.data[state.brandType] || {}) : {};
  const allComp = (bd.competitor || []).filter(i => matchesRegion(i));
  const allTsel = (bd.telkomsel  || []).filter(i => matchesRegion(i));

  const compBrands = [...new Set(allComp.map(i => i.brand))].length;
  const tselBrands = [...new Set(allTsel.map(i => i.brand))].length;
  const compPromos = allComp.filter(i => i.category === 'promo').length;
  const tselPromos = allTsel.filter(i => i.category === 'promo').length;
  const compProducts = allComp.filter(i => i.category === 'product');
  const tselProducts = allTsel.filter(i => i.category === 'product');
  const avgCompPrice = compProducts.length
    ? Math.round(compProducts.reduce((s,i) => s + (i.price||0), 0) / compProducts.length) : 0;
  const avgTselPrice = tselProducts.length
    ? Math.round(tselProducts.reduce((s,i) => s + (i.price||0), 0) / tselProducts.length) : 0;

  // Count sources in current view
  const allItems = [...allComp, ...allTsel];
  const srcCounts = {};
  allItems.forEach(i => { const s = i.source || 'website'; srcCounts[s] = (srcCounts[s]||0)+1; });
  const srcParts = Object.entries(srcCounts).map(([s,c]) => {
    const icon = s==='instagram'?'📸':s==='google_play'?'⭐':s==='app_store'?'🍎':'🌐';
    return `${icon} ${c}`;
  }).join(' · ');

  document.getElementById('summaryStrip').innerHTML = `
    <div class="stat-card comp">
      <div class="label">Kompetitor</div>
      <div class="value">${allComp.length}</div>
      <div class="sub">${compBrands} brand · ${compPromos} promo</div>
    </div>
    <div class="stat-card tsel">
      <div class="label">Telkomsel</div>
      <div class="value">${allTsel.length}</div>
      <div class="sub">${tselBrands} brand · ${tselPromos} promo</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg. Harga Kompetitor</div>
      <div class="value" style="font-size:18px;color:var(--comp)">${fmtPrice(avgCompPrice)}</div>
      <div class="sub">${compProducts.length} produk</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg. Harga Telkomsel</div>
      <div class="value" style="font-size:18px;color:var(--tsel)">${fmtPrice(avgTselPrice)}</div>
      <div class="sub">${tselProducts.length} produk</div>
    </div>
    <div class="stat-card">
      <div class="label">Region Filter</div>
      <div class="value" style="font-size:16px;font-weight:700;text-transform:capitalize;color:var(--text)">${state.region === 'all' ? 'Semua' : state.region.charAt(0).toUpperCase()+state.region.slice(1)}</div>
      <div class="sub">${srcParts || (state.brandType === 'mobile' ? 'Mobile network' : 'Fixed broadband')}</div>
    </div>
  `;
}

/* ─── Render: Product table ─────────────────────────────── */
function renderProductTable(items, role) {
  const cls = role === 'telkomsel' ? 'tsel' : 'comp';
  if (!items.length) return `<div class="empty">Tidak ada data untuk filter ini.</div>`;
  const rows = items.map(item => `
    <tr>
      <td><span class="brand-chip ${cls}">${item.brand}</span></td>
      <td>${item.name || item.title || '—'}</td>
      <td class="price" style="color:var(--${cls})">${fmtPrice(item.price)}</td>
      <td class="muted">${item.quota || '—'}</td>
      <td class="muted">${item.validity || '—'}</td>
      <td>${regionTags(item.regions)}</td>
    </tr>`).join('');
  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="${cls}-col">Brand</th>
            <th class="${cls}-col">Produk</th>
            <th class="${cls}-col">Harga</th>
            <th class="${cls}-col">Kuota</th>
            <th class="${cls}-col">Validitas</th>
            <th class="${cls}-col">Region</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* ─── Render: Price bar chart ───────────────────────────── */
function renderPriceChart(compItems, tselItems) {
  const allProducts = [
    ...compItems.filter(i => i.price),
    ...tselItems.filter(i => i.price),
  ];
  if (!allProducts.length) return '';

  const maxPrice = Math.max(...allProducts.map(i => i.price));
  if (!maxPrice) return '';

  const compRows = compItems.filter(i => i.price).slice(0,6).map(item => {
    const pct = Math.max(4, Math.round((item.price / maxPrice) * 100));
    const inside = pct > 30;
    return `
      <div class="bar-row">
        <div class="bar-label">${item.brand}</div>
        <div class="bar-track">
          <div class="bar-fill comp" style="width:${pct}%">
            ${inside ? `<span class="bar-value">${fmtPrice(item.price)}</span>` : ''}
          </div>
        </div>
        ${!inside ? `<span class="bar-value-outside">${fmtPrice(item.price)}</span>` : ''}
      </div>`;
  }).join('');

  const tselRows = tselItems.filter(i => i.price).slice(0,6).map(item => {
    const pct = Math.max(4, Math.round((item.price / maxPrice) * 100));
    const inside = pct > 30;
    return `
      <div class="bar-row">
        <div class="bar-label">${item.brand}</div>
        <div class="bar-track">
          <div class="bar-fill tsel" style="width:${pct}%">
            ${inside ? `<span class="bar-value">${fmtPrice(item.price)}</span>` : ''}
          </div>
        </div>
        ${!inside ? `<span class="bar-value-outside">${fmtPrice(item.price)}</span>` : ''}
      </div>`;
  }).join('');

  if (!compRows && !tselRows) return '';

  return `
    <div class="chart-panel">
      <h3>Perbandingan Harga Produk</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;min-width:400px">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--comp);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Kompetitor</div>
          <div class="bar-chart">${compRows || '<div class="empty" style="padding:12px">—</div>'}</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--tsel);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Telkomsel</div>
          <div class="bar-chart">${tselRows || '<div class="empty" style="padding:12px">—</div>'}</div>
        </div>
      </div>
    </div>`;
}

/* ─── Render: Sentiment ─────────────────────────────────── */
function renderSentiment(compItems, tselItems) {
  function brandSentiment(items) {
    const brands = {};
    items.forEach(item => {
      if (!brands[item.brand]) brands[item.brand] = { pos:0, neg:0, neu:0, role: item.role };
      const s = item.sentiment || 'neutral';
      brands[item.brand][s === 'positive' ? 'pos' : s === 'negative' ? 'neg' : 'neu']++;
    });
    return brands;
  }
  const compB = brandSentiment(compItems);
  const tselB = brandSentiment(tselItems);
  const allB = { ...compB, ...tselB };
  if (!Object.keys(allB).length) return '';

  const cards = Object.entries(allB).map(([brand, counts]) => {
    const total = counts.pos + counts.neg + counts.neu || 1;
    const role = counts.role;
    const cls = role === 'telkomsel' ? 'tsel' : 'comp';
    return `
      <div class="sentiment-card">
        <div class="sc-brand">
          ${brand}
          <span class="sc-role ${cls}">${role === 'telkomsel' ? 'Telkomsel' : 'Kompetitor'}</span>
        </div>
        <div class="sentiment-bars">
          <div class="sbar-row">
            <div class="sbar-dot pos"></div>
            <div class="sbar-name">Positif</div>
            <div class="sbar-track"><div class="sbar-fill pos" style="width:${Math.round(counts.pos/total*100)}%"></div></div>
            <div class="sbar-count">${counts.pos}</div>
          </div>
          <div class="sbar-row">
            <div class="sbar-dot neg"></div>
            <div class="sbar-name">Negatif</div>
            <div class="sbar-track"><div class="sbar-fill neg" style="width:${Math.round(counts.neg/total*100)}%"></div></div>
            <div class="sbar-count">${counts.neg}</div>
          </div>
          <div class="sbar-row">
            <div class="sbar-dot neu"></div>
            <div class="sbar-name">Netral</div>
            <div class="sbar-track"><div class="sbar-fill neu" style="width:${Math.round(counts.neu/total*100)}%"></div></div>
            <div class="sbar-count">${counts.neu}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div>
      <div class="section-head">
        <span class="section-title">Sentimen Ulasan</span>
        <span class="section-desc">Positif · Negatif · Netral per brand</span>
      </div>
      <div class="sentiment-grid">${cards}</div>
    </div>`;
}

/* ─── Render: Promo cards ───────────────────────────────── */
function renderPromoCards(items, role) {
  const cls = role === 'telkomsel' ? 'tsel' : 'comp';
  if (!items.length) return `<div class="empty">Tidak ada promo untuk filter ini.</div>`;
  return `<div class="promo-grid">${items.map(item => {
    const src = item.source || 'website';
    const isIG = src === 'instagram';
    const likesHtml = isIG && item.likes != null
      ? `<span class="pc-likes">❤ ${item.likes.toLocaleString('id-ID')} likes</span>`
      : '';
    const urlHtml = item.url
      ? `<a href="${item.url}" target="_blank" rel="noopener" style="font-size:10px;color:var(--comp);">Lihat →</a>`
      : '';
    return `
    <div class="promo-card">
      <div class="pc-header">
        <div class="pc-title">${item.title || '—'}</div>
        ${item.price ? `<div class="pc-price ${cls}">${fmtPrice(item.price)}</div>` : ''}
      </div>
      <div style="margin-bottom:2px">${sourceBadge(item)}</div>
      <div class="pc-snippet">${item.snippet || '—'}</div>
      <div class="pc-footer">
        <div class="pc-regions">${regionTags(item.regions)}</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${likesHtml}
          ${urlHtml}
          <span class="brand-chip ${cls}">${item.brand}</span>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ─── Render: Info list (program / service) ──────────────── */
function renderInfoList(items, role) {
  const cls = role === 'telkomsel' ? 'tsel' : 'comp';
  const icon = role === 'telkomsel' ? '★' : '◆';
  if (!items.length) return `<div class="empty">Tidak ada data untuk filter ini.</div>`;
  return `<div class="info-list">${items.map(item => `
    <div class="info-item">
      <div class="ii-icon ${cls}">${icon}</div>
      <div class="ii-body">
        <div class="ii-title">${item.title || '—'}</div>
        <div class="ii-snippet">${item.snippet || item.raw_snippet || '—'}</div>
        <div class="ii-meta">
          <span class="brand-chip ${cls}">${item.brand}</span>
          ${regionTags(item.regions)}
        </div>
      </div>
    </div>`).join('')}</div>`;
}

/* ─── Render: Complaint list ────────────────────────────── */
function renderComplaintList(items, role) {
  const cls = role === 'telkomsel' ? 'tsel' : 'comp';
  if (!items.length) return `<div class="empty">Tidak ada data untuk filter ini.</div>`;
  return `<div class="info-list">${items.map(item => {
    const s = item.sentiment || 'neutral';
    const sColor = s === 'positive' ? 'var(--pos)' : s === 'negative' ? 'var(--neg)' : 'var(--neu)';
    const sBg = s === 'positive' ? 'var(--pos-light)' : s === 'negative' ? 'var(--neg-light)' : 'var(--neu-light)';
    const sLabel = s === 'positive' ? 'Positif' : s === 'negative' ? 'Negatif' : 'Netral';
    const src = item.source || 'website';
    const ratingHtml = (item.rating != null && (src === 'google_play' || src === 'app_store'))
      ? `<span class="stars" title="${item.rating}/5">${renderStars(item.rating)}</span>`
      : '';
    const likesHtml = src === 'instagram' && item.likes != null
      ? `<span style="font-size:10px;color:var(--text-faint);">❤ ${item.likes.toLocaleString('id-ID')}</span>`
      : '';
    const urlHtml = item.url
      ? `<a href="${item.url}" target="_blank" rel="noopener" style="font-size:10px;color:var(--comp);">Lihat →</a>`
      : '';
    return `
    <div class="info-item">
      <div class="ii-icon ${cls}" style="background:${sBg};color:${sColor};font-size:11px;font-weight:700;letter-spacing:.02em">${sLabel.slice(0,3)}</div>
      <div class="ii-body">
        <div class="ii-title">${item.title || '—'}</div>
        <div class="ii-snippet">${item.snippet || item.raw_snippet || '—'}</div>
        <div class="ii-meta">
          <span class="brand-chip ${cls}">${item.brand}</span>
          <span style="font-size:10px;font-weight:600;color:${sColor};background:${sBg};padding:2px 7px;border-radius:10px">${sLabel}</span>
          ${sourceBadge(item)}
          ${ratingHtml}
          ${likesHtml}
          ${urlHtml}
          ${regionTags(item.regions)}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ─── Main render ───────────────────────────────────────── */
function render() {
  renderSummary();
  const { comp, tsel } = getAllItems();

  let html = '';
  const showSourceFilter = (state.category === 'complaint' || state.category === 'promo');

  if (state.category === 'product') {
    html += `
      <div class="section-head">
        <span class="section-title">Produk Kompetitor</span>
        <span class="section-desc">Paket, harga, kuota</span>
        <span class="section-badge badge-comp">${comp.length} item</span>
      </div>
      ${renderProductTable(comp, 'competitor')}`;

    if (comp.length || tsel.length) {
      html += renderPriceChart(comp, tsel);
    }

    html += `
      <div class="section-head">
        <span class="section-title">Produk Telkomsel</span>
        <span class="section-desc">SIMPATI · byU · Halo / IndiHome · EZnet</span>
        <span class="section-badge badge-tsel">${tsel.length} item</span>
      </div>
      ${renderProductTable(tsel, 'telkomsel')}`;

  } else if (state.category === 'promo') {
    html += renderSourceFilter();
    html += `
      <div class="section-head">
        <span class="section-title">Promo Kompetitor</span>
        <span class="section-badge badge-comp">${comp.length} promo</span>
      </div>
      ${renderPromoCards(comp, 'competitor')}
      <div class="section-head">
        <span class="section-title">Promo Telkomsel</span>
        <span class="section-badge badge-tsel">${tsel.length} promo</span>
      </div>
      ${renderPromoCards(tsel, 'telkomsel')}`;

  } else if (state.category === 'program') {
    html += `
      <div class="section-head">
        <span class="section-title">Program Kompetitor</span>
        <span class="section-desc">Loyalty, bundling, cicilan</span>
        <span class="section-badge badge-comp">${comp.length} item</span>
      </div>
      ${renderInfoList(comp, 'competitor')}
      <div class="section-head">
        <span class="section-title">Program Telkomsel</span>
        <span class="section-badge badge-tsel">${tsel.length} item</span>
      </div>
      ${renderInfoList(tsel, 'telkomsel')}`;

  } else if (state.category === 'service') {
    html += `
      <div class="section-head">
        <span class="section-title">Layanan Kompetitor</span>
        <span class="section-desc">Coverage, kecepatan, jaringan</span>
        <span class="section-badge badge-comp">${comp.length} item</span>
      </div>
      ${renderInfoList(comp, 'competitor')}
      <div class="section-head">
        <span class="section-title">Layanan Telkomsel</span>
        <span class="section-badge badge-tsel">${tsel.length} item</span>
      </div>
      ${renderInfoList(tsel, 'telkomsel')}`;

  } else if (state.category === 'complaint') {
    html += renderSourceFilter();
    html += renderSentiment(comp, tsel);
    html += `
      <div class="section-head">
        <span class="section-title">Ulasan Kompetitor</span>
        <span class="section-badge badge-comp">${comp.length} ulasan</span>
      </div>
      ${renderComplaintList(comp, 'competitor')}
      <div class="section-head">
        <span class="section-title">Ulasan Telkomsel</span>
        <span class="section-badge badge-tsel">${tsel.length} ulasan</span>
      </div>
      ${renderComplaintList(tsel, 'telkomsel')}`;
  }

  document.getElementById('contentArea').innerHTML = html;
}

/* ─── Control handlers ──────────────────────────────────── */
function setBrandType(t) {
  state.brandType = t;
  document.getElementById('btn-mobile').className = 'toggle-btn' + (t === 'mobile' ? ' active-mobile' : '');
  document.getElementById('btn-fixed').className  = 'toggle-btn' + (t === 'fixed'  ? ' active-fixed'  : '');
  render();
}

function setRegion(r) {
  state.region = r;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.region === r);
  });
  render();
}

function setCategory(c) {
  state.category = c;
  state.sourceFilter = 'all';
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === c);
  });
  render();
}

function setSourceFilter(src) {
  state.sourceFilter = src;
  render();
}

/* ─── Theme toggle ──────────────────────────────────────── */
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  if (!current) {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', prefersDark ? 'light' : 'dark');
  } else {
    root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  }
  const btn = document.querySelector('.theme-toggle');
  btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀' : '☾';
}

/* ─── Data loading ──────────────────────────────────────── */
async function loadData() {
  try {
    const resp = await fetch('../data/output.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('no file');
    const json = await resp.json();
    state.data = json;
    // Read last_updated from _meta if available
    let ts;
    if (json._meta && json._meta.last_updated) {
      try {
        ts = new Date(json._meta.last_updated).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      } catch {
        ts = json._meta.last_updated;
      }
    } else {
      ts = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
    }
    // Show source list from _meta if available
    const sources = (json._meta && json._meta.sources) ? json._meta.sources : [];
    const srcStr = sources.length
      ? ' · ' + sources.map(s => s === 'instagram' ? '📸' : s === 'google_play' ? '⭐' : s === 'app_store' ? '🍎' : '🌐').join(' ')
      : '';
    document.getElementById('lastUpdated').textContent = 'Diperbarui: ' + ts + srcStr;
    console.log('[CompetIntel] Loaded real data from output.json');
  } catch {
    state.data = MOCK;
    document.getElementById('lastUpdated').textContent = 'Last updated: Mock data (demo)';
    console.log('[CompetIntel] Using mock/demo data');
  }
  render();
}

/* ─── Init ──────────────────────────────────────────────── */
loadData();
</script>
